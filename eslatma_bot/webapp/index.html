html,body{min-height:100%}

.app{position:relative;z-index:1;max-width:480px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:54px;height:54px;flex:none;display:block}
.logo i{display:block;width:26px;height:24px;background:#f6f8ff;border-radius:5px;border-top:8px solid var(--red)}
h1{font-size:21px;font-weight:800;letter-spacing:.4px;margin:0;line-height:1.1}
header small{color:var(--mute)}

.sec{margin:20px 0 8px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.9px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row>div{min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.over .dot{background:var(--red)}.today .dot{background:var(--gold)}.soon .dot{background:var(--blue)}
.t{font-weight:700;overflow-wrap:anywhere}
.m{color:var(--mute);font-size:13px}
.amt{margin-left:auto;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:8px}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{font:inherit;color:var(--text);cursor:pointer}
.b{flex:1;min-width:110px;border:0;border-radius:12px;padding:11px;font-weight:700;font-size:14px;background:var(--surface2)}
.b.ok{background:var(--ok);color:#052b1d}
.b.red{background:var(--red)}
.b.ghost{background:transparent;border:1px solid var(--line)}
.b:focus-visible,.chip:focus-visible,nav button:focus-visible,.in:focus-visible,.day:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card.click .row{cursor:pointer}
.arrow{color:var(--mute);padding-left:6px}
textarea.in{min-height:96px;resize:vertical}
select.in{width:auto;padding:9px 10px}
.card.paused{opacity:.6}
nav em{font-style:normal;color:var(--gold);font-weight:800}
.fbtext{white-space:pre-wrap;overflow-wrap:anywhere;font-weight:600;margin:6px 0 0}
.ro{color:var(--mute)}
.note.warn{color:var(--gold)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.snz{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
label{display:block;font-size:13px;color:var(--mute);margin:16px 0 6px}
.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--text);font:inherit;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--blue);border-color:var(--blue);font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{padding:9px 0;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
.day.on{background:var(--red);border-color:var(--red);font-weight:800}
.day.wide{grid-column:span 7;padding:9px}
.err{color:#ff8a96;font-size:13px;margin-top:10px;min-height:18px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.sw>span:first-child{flex:none}

.tog:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--ok)}.tog.on:after{left:23px}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.note{font-size:12px;color:var(--mute);text-align:center;margin:20px 0 0}

    var sub=(p.days<0?t("daysN",-p.days)+" · ":"")+p.times.join(", ")+(p.snoozed?" · ⏰ "+t("kechiktirilgan")+" "+hhmm(p.fire_ts):"");
    var b='<div class="btns"><button class="b ok" data-act="done" data-oid="'+p.oid+'">'+t("done")+'</button><button class="b" data-act="later" data-oid="'+p.oid+'">'+t("later")+'</button></div>';
    if(snoozeOpen===p.oid)b+='<div class="snz">'+[15,60,180].map(function(m){return '<button class="chip" data-act="snz" data-oid="'+p.oid+'" data-v="'+m+'">'+t("m"+m)+'</button>'}).join("")+'<button class="chip" data-act="snz" data-oid="'+p.oid+'" data-v="tom">'+t("tom")+'</button></div>';
    return '<div class="card click '+cls+'"><div class="row" data-act="open" data-id="'+p.rid+'"><i class="dot"></i><div><div class="t">'+esc(p.title)+'</div><div class="m">'+esc(sub)+'</div></div>'+amt(p.amount)+'<span class="arrow">›</span></div>'+b+'</div>';
  }
  if(over.length){h+='<div class="sec">'+t("over")+'</div>';over.forEach(function(p){h+=item(p,"over")})}
  if(today.length){h+='<div class="sec">'+t("today")+'</div>';today.forEach(function(p){h+=item(p,"today")})}
  if(!over.length&&!today.length)h+='<div class="empty">'+t("emptyToday")+'</div>';
  if(soon.length){h+='<div class="sec">'+t("soon")+'</div>';soon.forEach(function(x){
    h+='<div class="card click soon"><div class="row" data-act="open" data-id="'+x.rid+'"><i class="dot"></i><div><div class="t">'+esc(x.title)+'</div><div class="m">'+dm(x.due)+" · "+rel(x.days)+'</div></div>'+amt(x.amount)+'<span class="arrow">›</span></div></div>'})}
  return h+'<p class="note">'+t("note")+'</p>';
}
function viewList(){
  if(!S.reminders.length)return '<div class="empty">'+t("emptyAll")+'</div>';
  var h='<div class="sec" style="margin-top:0">'+t("allhead",S.reminders.length)+'</div>';
  S.reminders.forEach(function(r){
    h+='<div class="card click'+(r.active?"":" paused")+'"><div class="row" data-act="open" data-id="'+r.id+'"><div><div class="t">'+esc(r.title)+(r.active?"":" · "+t("paused"))+'</div><div class="m">'+esc(freqText(r))+'</div></div>'+amt(r.amount)+'<span class="arrow">›</span></div></div>';
  });
  return h;
}
function newDraft(){return {id:null,title:"",freq:"monthly",day:null,date:"",times:["09:00"],lead:0,amount:"",err:""}}
function viewNew(){
  var d=draft||(draft=newDraft()), edit=d.id!=null, r=edit?find(d.id):null;
  function chips(items,on,act){return items.map(function(x){return '<button class="chip'+(on===x[0]?" on":"")+'" data-act="'+act+'" data-v="'+x[0]+'">'+x[1]+'</button>'}).join("")}
  var h=(edit?'<div class="sec" style="margin-top:0">'+t("editTitle")+'</div>':'')+'<label for="f-title" style="margin-top:'+(edit?6:0)+'px">'+t("qTitle")+'</label><input class="in" id="f-title" maxlength="80" placeholder="'+esc(t("ph"))+'" value="'+esc(d.title)+'">';
  h+='<label>'+t("when")+'</label><div class="chips">'+chips([["once",t("once")],["monthly",t("monthly")],["weekly",t("weekly")],["daily",t("daily")]],d.freq,"freq")+'</div>';
  if(d.freq==="monthly"){h+='<label>'+t("dom")+'</label><div class="days">';for(var i=1;i<=30;i++)h+='<button class="day'+(d.day===i?" on":"")+'" data-act="day" data-v="'+i+'">'+i+'</button>';
    h+='<button class="day wide'+(d.day===31?" on":"")+'" data-act="day" data-v="31">'+t("end")+'</button></div>'}
  if(d.freq==="weekly")h+='<label>'+t("wdl")+'</label><div class="chips">'+t("wd").map(function(w,i){return '<button class="chip'+(d.day===i?" on":"")+'" data-act="wd" data-v="'+i+'">'+w+'</button>'}).join("")+'</div>';
  if(d.freq==="once")h+='<label for="f-date">'+t("date")+'</label><input class="in" type="date" id="f-date" min="'+S.today+'" value="'+esc(d.date)+'">';
  var base=["09:00","12:00","18:00"],all=base.concat(d.times.filter(function(x){return base.indexOf(x)<0}));
  h+='<label>'+t("times")+'</label><div class="chips">'+all.map(function(x){return '<button class="chip'+(d.times.indexOf(x)>=0?" on":"")+'" data-act="time" data-v="'+x+'">'+x+'</button>'}).join("")+'<input class="in" type="time" id="f-time" style="width:auto;padding:8px 10px" aria-label="'+esc(t("otherTime"))+'"><button class="chip" data-act="addtime">'+t("addTime")+'</button></div>';
  h+='<label>'+t("lead")+'</label><div class="chips">'+[0,1,3,7].map(function(n){return '<button class="chip'+(d.lead===n?" on":"")+'" data-act="lead" data-v="'+n+'">'+t("l"+n)+'</button>'}).join("")+'</div>';
  h+='<label for="f-amt">'+t("amount")+'</label><input class="in" id="f-amt" inputmode="numeric" maxlength="48" placeholder="5 000 000" value="'+esc(money(d.amount))+'">';
  h+='<div class="err" id="err">'+esc(d.err)+'</div><div class="btns" style="margin-top:0"><button class="b red" data-act="save">'+t("save")+'</button>'+(edit?'<button class="b ghost" data-act="cancelEdit">'+t("cancel")+'</button>':"")+'</div>';
  if(edit&&r){
    h+='<div class="btns"><button class="b" data-act="pause" data-id="'+r.id+'">'+(r.active?t("pause"):t("resume"))+'</button>'+(r.freq!=="once"?'<button class="b" data-act="skip" data-id="'+r.id+'">'+t("skip")+'</button>':"")+'</div>';
    h+='<div class="btns">'+(delAsk===r.id?'<button class="b red" data-act="delyes" data-id="'+r.id+'">'+t("yesDel")+'</button><button class="b ghost" data-act="delno">'+t("cancel")+'</button>':'<button class="b ghost" data-act="del" data-id="'+r.id+'">'+t("del")+'</button>')+'</div>';
  }
  return h;
}
function viewSet(){
  var u=S.user;
  function chip(act,v,l,on){return '<button class="chip'+(on?" on":"")+'" data-act="'+act+'" data-v="'+v+'">'+l+'</button>'}
  var rp=u.repeat_h, qOff=u.quiet_start===u.quiet_end;
  function selHours(id,a,b,cur){var o="";for(var i=a;i<=b;i++)o+='<option value="'+i+'"'+(i===cur?" selected":"")+'>'+pad(i)+':00</option>';return '<select class="in" id="'+id+'" aria-label="'+id+'">'+o+'</select>'}
  var h='<div class="sec" style="margin-top:0">'+t("general")+'</div>'+
   '<div class="sw"><span>'+t("lang")+'</span><div class="chips">'+chip("lang","uz","🇺🇿 UZB",u.lang==="uz")+chip("lang","ru","🇷🇺 РУС",u.lang==="ru")+'</div></div>'+
   '<div class="sw"><span>'+t("tz")+'</span><div class="chips">'+chip("tz","5",t("tz5"),u.tz===5)+chip("tz","3",t("tz3"),u.tz===3)+'</div></div>'+
   '<div class="sw"><span>'+t("rep")+'</span><div class="chips">'+chip("rep","0",t("rep0"),rp===0)+chip("rep","0.016667",t("rep1m"),rp>0&&rp<0.1)+chip("rep","1",t("rep1"),rp===1)+chip("rep","3",t("rep3"),rp===3)+chip("rep","6",t("rep6"),rp===6)+'</div></div>'+
   '<div class="sw" style="align-items:flex-start"><span>'+t("quiet")+'</span><div><div class="chips" style="justify-content:flex-end">'+chip("quiet","off",t("quietOff"),qOff)+chip("quiet","on",t("quietOn"),!qOff)+'</div>'+
     (qOff?'':'<div class="chips" style="margin-top:8px;justify-content:flex-end;align-items:center"><span class="ro">'+t("qFrom")+'</span>'+selHours("qs",18,23,u.quiet_start)+'<span class="ro">—</span><span class="ro">'+t("qTo")+'</span>'+selHours("qe",4,10,u.quiet_end)+'</div><div class="m" style="text-align:right;margin-top:6px">'+t("quietNote")+'</div>')+'</div></div>'+
   '<div class="sw"><span>'+t("digest")+'</span><div class="chips">'+chip("dg","off",t("dgOff"),u.digest_hour==null)+[7,8,9].map(function(x){return chip("dg",x,pad(x)+":00",u.digest_hour===x)}).join("")+'</div></div>'+
   '<div class="sec">'+t("other")+'</div><div class="sw" data-act="fbtoggle" style="cursor:pointer"><span>'+t("fb")+'</span><span class="ro">'+(fbOpen?"▴":"▾")+'</span></div>';
  if(fbOpen)h+='<div class="panel"><div class="m" style="margin-bottom:8px">'+t("fbq")+'</div><textarea class="in" id="f-fb" maxlength="1000">'+esc(fbText)+'</textarea><div class="err" id="fberr"></div><div class="btns" style="margin-top:6px"><button class="b red" data-act="fbsend">'+t("fbSend")+'</button></div></div>';
  h+='<div class="sw" data-act="privtoggle" style="cursor:pointer"><span>'+t("priv")+'</span><span class="ro">'+(privOpen?"▴":"▾")+'</span></div>';
  if(privOpen)h+='<div class="panel m">'+t("privText")+'</div>';
  return h+'<p class="note">'+t("note")+'</p>';
}
function dtm(ts){var d=new Date((ts+S.user.tz*3600)*1000);return pad(d.getUTCDate())+"."+pad(d.getUTCMonth()+1)+" "+pad(d.getUTCHours())+":"+pad(d.getUTCMinutes())}
function viewInbox(){
  var all=S.feedback||[], n=all.filter(function(f){return !f.done}).length;
  var list=all.filter(function(f){return fbFilter==="all"||(fbFilter==="done"?f.done:!f.done)});
  var h='<div class="sec" style="margin-top:0">'+t("inboxHead")+'</div><div class="chips">'+[["new",t("fbNew")+" ("+n+")"],["done",t("fbDoneF")],["all",t("fbAllF")]].map(function(x){return '<button class="chip'+(fbFilter===x[0]?" on":"")+'" data-act="fbfilter" data-v="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div>';
  if(!list.length)h+='<div class="empty">'+t("fbNone")+'</div>';
  list.forEach(function(f){
    h+='<div class="card'+(f.done?" paused":"")+'"><div class="m">#'+f.id+' · '+dtm(f.ts)+'</div><div class="fbtext">'+esc(f.text)+'</div><div class="btns"><button class="b '+(f.done?"ghost":"ok")+'" data-act="fbdone" data-id="'+f.id+'" data-v="'+(f.done?0:1)+'">'+(f.done?t("fbUndo"):t("fbMark"))+'</button></div></div>';
  });
  return h+'<p class="note">'+t("fbAnon")+'</p>';
}
function render(){
  document.documentElement.lang=lang;
  [].forEach.call(document.querySelectorAll("[data-i]"),function(e){e.textContent=t(e.dataset.i)});
  var v=document.getElementById("view");
  if(!S){return}
  var ib=document.getElementById("tab-inbox");ib.hidden=!S.admin;
  document.querySelector("#tabs").style.gridTemplateColumns="repeat("+(S.admin?5:4)+",1fr)";
  var nn=S.admin?(S.feedback||[]).filter(function(f){return !f.done}).length:0;document.getElementById("inbox-n").textContent=nn?" "+nn:"";
  if(tab==="inbox"&&!S.admin)tab="home";
  v.innerHTML={home:viewHome,list:viewList,new:viewNew,set:viewSet,inbox:viewInbox}[tab]();
  [].forEach.call(document.querySelectorAll("#tabs button"),function(b){b.classList.toggle("on",b.dataset.tab===tab)});
}
function go(x){if(x!=="new")draft=null;tab=x;snoozeOpen=null;delAsk=null;render();window.scrollTo(0,0)}
function openEdit(r){prevTab=tab==="new"?prevTab:tab;draft={id:r.id,title:r.title,freq:r.freq,day:r.day,date:r.date||"",times:r.times.slice(),lead:r.lead,amount:r.amount||"",err:""};tab="new";delAsk=null;snoozeOpen=null;render();window.scrollTo(0,0)}
function syncDraft(){if(!draft)return;var a=document.getElementById("f-title"),m=document.getElementById("f-amt"),d=document.getElementById("f-date");if(a)draft.title=a.value;if(m)draft.amount=m.value.replace(/\D/g,"");if(d)draft.date=d.value}

document.addEventListener("click",function(e){
  var tb=e.target.closest("#tabs button");if(tb){go(tb.dataset.tab);return}
  var el=e.target.closest("[data-act]");if(!el||!S)return;
  var a=el.dataset.act,v=el.dataset.v,id=el.dataset.id,oid=el.dataset.oid;
  if(a==="open"){var r=find(id);if(r)openEdit(r)}
  else if(a==="done")act("done",{oid:+oid},"tDone",function(){snoozeOpen=null});
  else if(a==="later"){snoozeOpen=snoozeOpen==+oid?null:+oid;render()}
  else if(a==="snz")act("snooze",v==="tom"?{oid:+oid,tomorrow:true}:{oid:+oid,minutes:+v},"tLater",function(){snoozeOpen=null});
  else if(a==="del"){delAsk=+id;render()}
  else if(a==="delno"){delAsk=null;render()}
  else if(a==="delyes")act("delete",{id:+id},"tDel",function(){delAsk=null;draft=null;tab=prevTab;});
  else if(a==="pause")act("pause",{id:+id},"tSet");
  else if(a==="skip")act("skip",{id:+id},"tSkip");
  else if(a==="freq"){syncDraft();draft.freq=v;draft.day=null;draft.err="";render()}
  else if(a==="day"){syncDraft();draft.day=+v;render()}
  else if(a==="wd"){syncDraft();draft.day=+v;render()}
  else if(a==="lead"){syncDraft();draft.lead=+v;render()}
  else if(a==="time"){syncDraft();var i=draft.times.indexOf(v);if(i>=0)draft.times.splice(i,1);else draft.times.push(v);draft.times.sort();render()}
  else if(a==="addtime"){syncDraft();var tv=document.getElementById("f-time").value;if(tv&&draft.times.indexOf(tv)<0&&draft.times.length<12){draft.times.push(tv);draft.times.sort()}render()}
  else if(a==="save"){syncDraft();saveDraft()}
  else if(a==="cancelEdit"){go(prevTab)}
  else if(a==="quiet")act("settings",v==="off"?{quiet_off:true}:{quiet_start:22,quiet_end:7},"tSet");
  else if(a==="fbfilter"){fbFilter=v;render()}
  else if(a==="fbdone")act("fb_done",{id:+id,done:v==="1"},"tSet");
  else if(a==="lang")act("settings",{lang:v},"tSet");
  else if(a==="tz")act("settings",{tz:+v},"tSet");
  else if(a==="rep")act("settings",{repeat_h:+v},"tSet");
  else if(a==="dg")act("settings",{digest_hour:v==="off"?null:+v},"tSet");
  else if(a==="fbtoggle"){fbOpen=!fbOpen;render()}
  else if(a==="privtoggle"){privOpen=!privOpen;render()}
  else if(a==="fbsend"){var f=document.getElementById("f-fb");fbText=f?f.value:"";if(!fbText.trim()){document.getElementById("fberr").textContent=t("fbEmpty");return}
    var txt=fbText;act("feedback",{text:txt},"tFb",function(){fbText="";fbOpen=false})}
});
function saveDraft(){
  var d=draft;
  if(!d.title.replace(/\s+/g," ").trim()){d.err=t("eTitle");return render()}
  if(d.freq==="monthly"&&!d.day){d.err=t("eDay");return render()}
  if(d.freq==="weekly"&&d.day==null){d.err=t("eWd");return render()}
  if(d.freq==="once"&&!d.date){d.err=t("eDate");return render()}
  if(!d.times.length){d.err=t("eTime");return render()}
  var p={title:d.title,freq:d.freq,times:d.times,lead:d.lead,amount:d.amount};
  if(d.id!=null)p.id=d.id;
  if(d.freq==="monthly"||d.freq==="weekly")p.day=d.day;
  if(d.freq==="once")p.date=d.date;
  var back=d.id!=null?prevTab:"home";
  act("reminder",p,"tSaved",function(){draft=null;tab=back;snoozeOpen=null;delAsk=null;window.scrollTo(0,0)});
}
document.addEventListener("change",function(e){
  if((e.target.id==="qs"||e.target.id==="qe")&&S){var a=document.getElementById("qs"),b=document.getElementById("qe");act("settings",{quiet_start:+a.value,quiet_end:+b.value},"tSet")}
});
document.addEventListener("input",function(e){
  if(e.target.id==="f-fb")fbText=e.target.value;
  if(e.target.id==="f-amt"){var pos=e.target.selectionStart,before=e.target.value.length;e.target.value=money(e.target.value);var diff=e.target.value.length-before;try{e.target.setSelectionRange(pos+diff,pos+diff)}catch(x){}}
});

/* ---- boshlash ---- */
function boot(){
  if(!INIT){document.getElementById("view").innerHTML='<div class="empty">'+t("openTg")+'</div>';render();return}
  call("state").then(function(st){S=st;lang=st.user.lang;render()},function(e){
    var k=e.code==="net"?"eNet":errText(e.code);document.getElementById("view").innerHTML='<div class="empty">'+t(k)+'</div>'});
}
render();boot();
})();
</script>
</body>
</html>
